<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Psico-Agenda</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css_proyecto/Iniciar_sesion.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar custom-navbar py-3">
        <div class="container d-flex justify-content-between align-items-center">

            <!-- Logo -->
            <div class="d-flex align-items-center gap-2">
                <img src="./imagenes/Captura de pantalla 2026-03-12 144542.png" alt="logo" class="logo">
                <h2 class="brand-title m-0">Psico-Agenda</h2>
            </div>

            <!-- Botón volver -->
            <a href="./proyecto.html" class="btn login-btn">Inicio</a>

        </div>
    </nav>

    <!-- CONTENIDO -->
    <section class="login-section d-flex align-items-center">
        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="login-card p-5 text-center">

                        <h1 class="login-title">¡Inicia Sesión!</h1>

                        <p class="login-subtitle mt-2">
                            Ingresa con tu correo institucional
                        </p>

                        <!-- FORMULARIO -->
                        <form class="mt-4">

                            <input type="email" class="form-control mb-3"
                                placeholder="Correo institucional" required>

                            <input type="password" class="form-control mb-4"
                                placeholder="Contraseña" required>

                            <button class="btn submit-btn w-100">
                                Ingresar
                            </button>

                        </form>

                        <!-- DOCENTES -->
                        <div class="mt-4">
                            <p>¿Eres docente?</p>
                            <a href="./iniciar_sesionDC.html" class="docente-link">
                                Iniciar sesión para docentes
                            </a>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
