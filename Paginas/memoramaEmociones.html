<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memorama de Emociones - Psico-Agenda</title>

    <link rel="stylesheet" href="../css_proyecto/memoramaEmociones.css">

</head>

<body>

    <main class="contenedor">

        <h1>
            Memorama de Emociones
        </h1>

        <p class="descripcion">

            Encuentra todas las parejas de emociones y aprende un poco sobre cada una.

        </p>

        <div class="estadisticas">

            <span>
                Movimientos: <strong id="movimientos">0</strong>
            </span>

            <span>
                Parejas: <strong id="parejas">0</strong>/8
            </span>

        </div>

        <div id="tablero" class="tablero"></div>

        <div id="mensaje" class="mensaje"></div>

        <button id="reiniciar" class="btn-reiniciar">

            Reiniciar Juego

        </button>

    </main>

    <script src="../js/memoramaEmociones.js"></script>

</body>

</html>

<!--"Como estudiantes, quisimos agregar un memorama de emociones para que la página también tenga un espacio interactivo y
entretenido. Con este juego, los usuarios pueden reconocer diferentes emociones mientras se divierten buscando las
parejas, y además aprender un poco sobre cada una de ellas. Creemos que es una forma sencilla de complementar el enfoque
de bienestar y apoyo que busca promover Psico-Agenda."-->
